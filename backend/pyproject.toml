[project]
name = "app"
version = "0.1.0"
description = "Google Docs Clone Backend with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Prem Raj Awasthi", email = "your@email.com"}
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.30.0",
    "alembic>=1.14.1",
    "pydantic>=2.14.0b1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.2.1",
    "pycrdt>=0.14.0",
    "boto3>=1.35.92",
    "python-multipart>=0.0.32",
    "websockets>=14.2",
    "email-validator>=2.0.0",
    "cloudinary>=1.46.2",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
    "black>=24.10.0",
    "ruff>=0.9.2",
    "mypy>=1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/tests",
    "README.md",
    "pyproject.toml",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
